databases:
  - name: plantpal_db
    databaseName: plantpal_db
    user: plantpal_user
    plan: free

services:
  - type: web
    name: plantpal-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plantpal_db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 4
      - fromGroup: plantpal-secrets 