<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPal - Setup Packages</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2d3748; text-align: center; }
        .btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        .btn:hover { background: #38a169; }
        .btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
        }
        .success { background: #f0fff4; border: 1px solid #9ae6b4; color: #276749; }
        .error { background: #fed7d7; border: 1px solid #feb2b2; color: #c53030; }
        .loading { background: #fef5e7; border: 1px solid #f6ad55; color: #c05621; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 PlantPal Package Setup</h1>
        <p>Click the button below to create the default leaf packages in your production database.</p>
        
        <button class="btn" onclick="setupPackages()" id="setupBtn">
            🚀 Setup Packages
        </button>
        
        <div id="result"></div>
    </div>

    <script>
        async function setupPackages() {
            const btn = document.getElementById('setupBtn');
            const result = document.getElementById('result');
            
            // Disable button and show loading
            btn.disabled = true;
            btn.textContent = '⏳ Setting up packages...';
            result.innerHTML = '<div class="loading">Setting up packages... Please wait.</div>';
            
            try {
                const response = await fetch('https://plantpal-4hx7.onrender.com/api/payments/setup-packages/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <div class="success">
                            ✅ ${data.message}
                            
                            📊 Summary:
                            • Created: ${data.summary.created} packages
                            • Updated: ${data.summary.updated} packages
                            • Deactivated: ${data.summary.deactivated} old packages
                            • Total active: ${data.summary.total_active} packages
                            
                            📦 Available Packages:
                            ${data.packages.map(pkg => 
                                `• ${pkg.name}: ${pkg.leaves} leaves for KES ${pkg.price}`
                            ).join('\n')}
                            
                            🎉 You can now refresh your buy leaves page to see the packages!
                        </div>
                    `;
                    btn.textContent = '✅ Setup Complete!';
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Setup failed: ${error.message}
                        
                        Please try again or contact support.
                    </div>
                `;
                btn.textContent = '🚀 Setup Packages';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
